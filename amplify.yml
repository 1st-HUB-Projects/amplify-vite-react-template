version: 1
backend:
  phases:
    build:
      commands:
        - amplifyPush --simple  # Provisions backend resources like AppSync GraphQL API and DynamoDB tables based on resource.ts
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - amplify codegen types --yes  # Regenerates API.ts, graphql/ based on new schema
    build:
      commands:
        - npm run build  # Builds your Vite/React app (adjust if your script is different)
  artifacts:
    baseDirectory: dist  # Output directory for Vite builds; adjust if needed (e.g., to 'build' for CRA)
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*