# This file configures the build and deployment process for Amplify Hosting.
version: 1
backend:
  phases:
    build:
      commands:
        # We use 'npm ci' for faster, more reliable installs in CI/CD
        - npm ci
        # The key change is adding the '--allow-destructive-changes' flag.
        # This tells Amplify that we approve the deletion of the old 'Todo'
        # table and the creation of the new 'Cloud Kitchen' tables.
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --allow-destructive-changes
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # This tells Amplify where to find the built frontend assets (for Vite)
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
