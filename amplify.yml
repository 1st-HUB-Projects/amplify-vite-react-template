version: 1
backend:
  phases:
    build:
      commands:
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --yes  # Deploys Gen 2 backend
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - amplify codegen types --yes  # Regenerates API.ts, graphql/ based on new schema
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*